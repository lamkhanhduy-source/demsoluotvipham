<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Số Lượt Vi Phạm Quy Định</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .sync-status {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }

        .sync-status.local {
            background: #e0f2fe;
            color: #0369a1;
        }

        .sync-status.online {
            background: #d1fae5;
            color: #065f46;
        }

        .sync-status.syncing {
            background: #fef3c7;
            color: #92400e;
        }

        .sync-status.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .setup-box {
            background: #f0f9ff;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .setup-box h3 {
            color: #1e40af;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .setup-box p {
            color: #475569;
            margin-bottom: 10px;
            line-height: 1.6;
            font-size: 14px;
        }

        .setup-box ol {
            color: #475569;
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .setup-box li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .setup-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            margin: 10px 0;
        }

        .setup-box button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .setup-box button:hover {
            background: #2563eb;
        }

        .setup-box .link {
            color: #3b82f6;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }

        .setup-box code {
            background: #1e293b;
            color: #22d3ee;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .add-person {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-person input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .add-person input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-person button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-person button:hover {
            background: #5568d3;
        }

        .person-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .person-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .person-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .person-info {
            flex: 1;
        }

        .person-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .person-count {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .person-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .tick-btn {
            background: #10b981;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tick-btn:hover {
            background: #059669;
            transform: scale(1.1);
        }

        .tick-btn:active {
            transform: scale(0.95);
        }

        .reset-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }
        
        .controls {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            flex: 1;
        }
        
        .stat-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            display: block;
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .sort-btn, .export-btn, .sync-btn, .reset-all-btn, .delete-all-btn, .settings-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .sort-btn {
            background: #667eea;
            color: white;
        }
        
        .sort-btn:hover {
            background: #5568d3;
        }

        .sync-btn {
            background: #06b6d4;
            color: white;
        }

        .sync-btn:hover {
            background: #0891b2;
        }

        .settings-btn {
            background: #8b5cf6;
            color: white;
        }

        .settings-btn:hover {
            background: #7c3aed;
        }
        
        .export-btn {
            background: #10b981;
            color: white;
        }
        
        .export-btn:hover {
            background: #059669;
        }
        
        .reset-all-btn {
            background: #f59e0b;
            color: white;
        }
        
        .reset-all-btn:hover {
            background: #d97706;
        }
        
        .delete-all-btn {
            background: #ef4444;
            color: white;
        }
        
        .delete-all-btn:hover {
            background: #dc2626;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .syncing-icon {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @media (max-width: 600px) {
            .stats {
                flex-direction: column;
            }
            
            .action-buttons button {
                flex: 1 1 calc(50% - 5px);
            }

            .container {
                padding: 20px;
            }
        }

        .banquyen {
            text-align: center;
            font-weight: 800;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        .info-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Đếm Số Lượt Vi Phạm Quy Định</h1>
        
        <div class="sync-status local" id="syncStatus">
            <span id="syncIcon">📱</span>
            <span id="syncText">Chế độ Local - Chỉ lưu trên thiết bị này</span>
        </div>

        <!-- Setup Box -->
        <div class="setup-box" id="setupBox">
            <h3>☁️ Thiết lập đồng bộ GitHub Gist <span class="info-badge">MIỄN PHÍ</span></h3>
            <input type="text" id="gistIdInput" placeholder="Nhập Gist ID (vd: abc123def456789)" />
            <input type="text" id="tokenInput" placeholder="Nhập GitHub Token (ghp_xxx...)" />
            <button onclick="saveGistSettings()">💾 Lưu cài đặt và đồng bộ</button>
            <p style="margin-top: 10px; font-size: 12px; color: #64748b;">
                ⚠️ Bỏ qua → Chỉ lưu trên thiết bị này (không đồng bộ)
            </p>
        </div>
        
        <div class="add-person">
            <input type="text" id="nameInput" placeholder="Nhập họ và tên..." />
            <button onclick="addPerson()">Thêm</button>
        </div>

        <div class="person-list" id="personList">
            <div class="empty-state">Chưa có ai trong danh sách. Hãy thêm người mới!</div>
        </div>
        
        <div class="controls" id="controls" style="display: none;">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Tổng số người:</span>
                    <span class="stat-value" id="totalPeople">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tổng số lượt:</span>
                    <span class="stat-value" id="totalTicks">0</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="sync-btn" onclick="manualSync()" id="syncBtn">🔄 Đồng bộ</button>
                <button class="settings-btn" onclick="toggleSetup()">⚙️ Cài đặt</button>
                <button class="sort-btn" onclick="sortBy('name')">📝 A-Z</button>
                <button class="sort-btn" onclick="sortBy('count')">📊 Số lượt</button>
                <button class="export-btn" onclick="exportToExcel()">💾 Xuất Excel</button>
                <button class="reset-all-btn" onclick="resetAll()">🔄 Reset</button>
                <button class="delete-all-btn" onclick="deleteAll()">🗑️ Xóa tất cả</button>
            </div>
        </div>
        <br>
        <div class="banquyen">
            <p>Design By Lâm Khánh Duy</p>
        </div>
    </div>

    <script>
        let people = [];
        let isSyncing = false;
        let gistConfig = {
            gistId: '',
            token: '',
            enabled: false
        };

        // Load config
        function loadConfig() {
            const saved = localStorage.getItem('gistConfig');
            if (saved) {
                gistConfig = JSON.parse(saved);
                if (gistConfig.enabled) {
                    document.getElementById('setupBox').classList.add('hidden');
                    updateSyncStatus('online', 'GitHub Gist đã kết nối ✅', '☁️');
                }
            }
        }

        // Lưu config
        async function saveGistSettings() {
            const gistId = document.getElementById('gistIdInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();
            
            if (!gistId || !token) {
                alert('❌ Vui lòng nhập đầy đủ Gist ID và Token!');
                return;
            }

            gistConfig = { gistId, token, enabled: true };
            localStorage.setItem('gistConfig', JSON.stringify(gistConfig));
            document.getElementById('setupBox').classList.add('hidden');
            updateSyncStatus('online', 'GitHub Gist đã kết nối ✅', '☁️');
            
            // Thử load ngay
            await loadFromGist();
            alert('✅ Đã kết nối! Dữ liệu sẽ đồng bộ tự động.');
        }

        // Toggle setup
        function toggleSetup() {
            const box = document.getElementById('setupBox');
            box.classList.toggle('hidden');
        }

        // Update status
        function updateSyncStatus(status, message, icon = '📱') {
            const statusEl = document.getElementById('syncStatus');
            const textEl = document.getElementById('syncText');
            const iconEl = document.getElementById('syncIcon');
            
            statusEl.className = 'sync-status ' + status;
            textEl.textContent = message;
            iconEl.textContent = icon;
            
            if (status === 'syncing') {
                iconEl.classList.add('syncing-icon');
            } else {
                iconEl.classList.remove('syncing-icon');
            }
        }

        // Lưu lên Gist
        async function saveToGist() {
            if (!gistConfig.enabled || isSyncing) return;
            
            isSyncing = true;
            updateSyncStatus('syncing', 'Đang lưu lên GitHub...', '🔄');
            
            try {
                const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${gistConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'violation-data.json': {
                                content: JSON.stringify({
                                    people: people,
                                    lastUpdate: new Date().toISOString()
                                }, null, 2)
                            }
                        }
                    })
                });

                if (response.ok) {
                    updateSyncStatus('online', `✅ Đã đồng bộ (${people.length} người)`, '☁️');
                    console.log('✅ Đã lưu lên GitHub Gist');
                } else {
                    throw new Error('Không thể lưu');
                }
            } catch (error) {
                console.error('❌ Lỗi:', error);
                updateSyncStatus('offline', '❌ Lỗi đồng bộ - ' + error.message, '⚠️');
            } finally {
                isSyncing = false;
            }
        }

        // Tải từ Gist
        async function loadFromGist() {
            if (!gistConfig.enabled) {
                loadFromLocal();
                return;
            }
            
            updateSyncStatus('syncing', 'Đang tải từ GitHub...', '🔄');
            
            try {
                const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`, {
                    headers: {
                        'Authorization': `token ${gistConfig.token}`
                    }
                });

                if (response.ok) {
                    const gist = await response.json();
                    const fileContent = gist.files['violation-data.json'].content;
                    const data = JSON.parse(fileContent);
                    people = data.people || [];
                    updateSyncStatus('online', `✅ Đã tải (${people.length} người)`, '☁️');
                    console.log('✅ Đã tải từ GitHub Gist');
                } else {
                    throw new Error('Không thể tải');
                }
            } catch (error) {
                console.error('❌ Lỗi:', error);
                updateSyncStatus('offline', '❌ Lỗi tải - kiểm tra Gist ID/Token', '⚠️');
                loadFromLocal();
            }
            
            saveToLocal();
            renderList();
        }

        // Local storage
        function saveToLocal() {
            localStorage.setItem('violationData', JSON.stringify(people));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('violationData');
            if (saved) {
                people = JSON.parse(saved);
            }
            renderList();
        }

        // Manual sync
        async function manualSync() {
            if (!gistConfig.enabled) {
                alert('⚠️ Chưa thiết lập GitHub Gist! Nhấn "⚙️ Cài đặt" để cấu hình.');
                toggleSetup();
                return;
            }
            await saveToGist();
            await loadFromGist();
        }

        async function addPerson() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('Vui lòng nhập tên!');
                return;
            }

            people.push({
                id: Date.now(),
                name: name,
                count: 0
            });

            input.value = '';
            saveToLocal();
            if (gistConfig.enabled) await saveToGist();
            renderList();
        }

        async function tick(id) {
            const person = people.find(p => p.id === id);
            if (person) {
                person.count++;
                saveToLocal();
                if (gistConfig.enabled) await saveToGist();
                renderList();
            }
        }

        async function reset(id) {
            const person = people.find(p => p.id === id);
            if (person) {
                person.count = 0;
                saveToLocal();
                if (gistConfig.enabled) await saveToGist();
                renderList();
            }
        }

        async function deletePerson(id) {
            if (confirm('Bạn có chắc muốn xóa người này?')) {
                people = people.filter(p => p.id !== id);
                saveToLocal();
                if (gistConfig.enabled) await saveToGist();
                renderList();
            }
        }
        
        async function sortBy(criteria) {
            if (criteria === 'name') {
                people.sort((a, b) => a.name.localeCompare(b.name, 'vi'));
            } else if (criteria === 'count') {
                people.sort((a, b) => b.count - a.count);
            }
            saveToLocal();
            if (gistConfig.enabled) await saveToGist();
            renderList();
        }
        
        async function resetAll() {
            if (confirm('Bạn có chắc muốn reset tất cả về 0?')) {
                people.forEach(p => p.count = 0);
                saveToLocal();
                if (gistConfig.enabled) await saveToGist();
                renderList();
            }
        }
        
        async function deleteAll() {
            if (confirm('Bạn có chắc muốn xóa tất cả người trong danh sách?')) {
                people = [];
                saveToLocal();
                if (gistConfig.enabled) await saveToGist();
                renderList();
            }
        }

        function exportToExcel() {
            let csvContent = "\uFEFF";
            csvContent += "STT,Họ và Tên,Số lần vi phạm\n";
            
            people.forEach((person, index) => {
                csvContent += `${index + 1},"${person.name}",${person.count}\n`;
            });
            
            const total = people.reduce((sum, p) => sum + p.count, 0);
            csvContent += `\n,TỔNG CỘNG,${total}\n`;
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bao-cao-vi-pham-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

       function renderList() {
    const listEl = document.getElementById('personList');
    const controlsEl = document.getElementById('controls');

    if (people.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Chưa có ai trong danh sách. Hãy thêm người mới!</div>';
        controlsEl.style.display = 'none';
        return;
    }

    controlsEl.style.display = 'block';

    listEl.innerHTML = people.map(p => `
        <div class="person-item">
            <div class="person-info">
                <div class="person-name">${p.name}</div>
                <div class="person-count">${p.count}</div>
            </div>

            <div class="person-actions">
                <button class="tick-btn" onclick="tick(${p.id})">+</button>
                <button class="reset-btn" onclick="reset(${p.id})">Reset</button>
                <button class="delete-btn" onclick="deletePerson(${p.id})">Xóa</button>
            </div>
        </div>
    `).join('');

    // Cập nhật thống kê
    document.getElementById('totalPeople').textContent = people.length;
    document.getElementById('totalTicks').textContent = people.reduce((sum, p) => sum + p.count, 0);
}

        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPerson();
            }
        });

        // Auto sync
        setInterval(async () => {
            if (gistConfig.enabled && !isSyncing && people.length > 0) {
                await loadFromGist();
            }
        }, 60000);

        // Init
        loadConfig();
        if (gistConfig.enabled) {
            loadFromGist();
        } else {
            loadFromLocal();
        }
    </script>
</body>
</html>
